services:
  postgres:
    image: postgres:16-alpine
    container_name: daily-outfit-weather-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daily_outfit_weather}
      POSTGRES_USER: ${POSTGRES_USER:-daily_outfit_weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daily_outfit_weather}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daily_outfit_weather} -d ${POSTGRES_DB:-daily_outfit_weather}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
