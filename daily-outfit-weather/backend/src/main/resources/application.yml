spring:
  application:
    name: daily-outfit-weather-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/daily_outfit_weather}
    username: ${POSTGRES_USER:daily_outfit_weather}
    password: ${POSTGRES_PASSWORD:daily_outfit_weather}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - email
              - profile

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

logging:
  file:
    name: ${LOG_FILE:logs/backend.log}

app:
  frontend:
    success-url: ${APP_FRONTEND_SUCCESS_URL:http://localhost:5173}
  security:
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    generate-due-token: ${APP_NOTIFICATION_GENERATE_DUE_TOKEN:}
  weather:
    fallback-enabled: ${APP_WEATHER_FALLBACK_ENABLED:true}

kma:
  service-key: ${KMA_SERVICE_KEY:}
  base-url: ${KMA_BASE_URL:http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
  connect-timeout: ${KMA_CONNECT_TIMEOUT:2s}
  read-timeout: ${KMA_READ_TIMEOUT:3s}
