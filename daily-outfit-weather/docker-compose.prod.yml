services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-${APP_FRONTEND_SUCCESS_URL}/login/oauth2/code/google}
      APP_FRONTEND_SUCCESS_URL: ${APP_FRONTEND_SUCCESS_URL}
      APP_SECURITY_ALLOWED_ORIGINS: ${APP_SECURITY_ALLOWED_ORIGINS:-${APP_FRONTEND_SUCCESS_URL}}
      APP_NOTIFICATION_GENERATE_DUE_TOKEN: ${APP_NOTIFICATION_GENERATE_DUE_TOKEN}
      APP_WEATHER_FALLBACK_ENABLED: ${APP_WEATHER_FALLBACK_ENABLED:-true}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY}
      KMA_BASE_URL: ${KMA_BASE_URL:-http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
      KMA_CONNECT_TIMEOUT: ${KMA_CONNECT_TIMEOUT:-2s}
      KMA_READ_TIMEOUT: ${KMA_READ_TIMEOUT:-3s}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      LOG_FILE: ${LOG_FILE:-/app/logs/backend.log}
    volumes:
      - backend-logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  backend-logs:
